<style>

}],

15:["Hackathon Day 2",["Verify final dataset outputs.","Complete data-source and limitations documentation.","Ensure the project does not use unsupported claims.","Prepare an explanation of NASA data usage for the demo."],["Fatima Javaid~15~","Zohaib~15~","Umama~15~"]]
}],

9:["User Inputs & Wireframes",["Prepare a rough farmer-input form layout.","Consider inputs such as location, current crop, previous crop and irrigation availability.","Keep soil information optional and easy to enter."],["Hussnain~10~","Zohaib~10~","Umama~10~"]],

13:["UI Adjustment According to Actual Data",["Update dashboard fields after reviewing official NASA resources.","Include only indicators for which actual data is available.","Update crop-comparison sections to match final data outputs."],["Hussnain~13~","Fatima Javaid~13~","Fatima Jannat~13~"]],
14:["Hackathon Day 1",["Start frontend development.","Implement the farmer input form.","Develop dashboard and environmental-indicator sections.","Implement the crop-comparison interface.","Receive backend integration updates."],["Hussnain~14~","Fatima Javaid~14~","Umama~14~"]],
15:["Hackathon Day 2",["Fix UI bugs.","Improve dashboard and charts.","Ensure all screens are properly connected.","Test the final user journey.","Prepare the interface for the demo.","Explain the app flow."],["Hussnain~15~","Fatima Javaid~15~","Umama~15~"]]
} };
const G=[["Region selection","Keep Multan as the initial candidate, but make the final region decision on 13 November after checking NASA data availability and reliable local agricultural information."],["Team structure","Everyone contributes through research, technical work, UI and integration, with a single shared workflow and clear responsibilities across all tasks."],["Key milestone","The team uses a combined planning and hackathon timeline: research and validation happen between 8–13 November, then core build and demo work happens on 14–15 November."]];
const N=Object.keys(R),D=[8,9,10,11,12,13,14,15],ST=["Not Started","In Progress","Completed","Blocked"];
let S={};try{S=JSON.parse(localStorage.getItem("t3")||"{}")}catch(e){}
const sv=()=>{try{localStorage.setItem("t3",JSON.stringify(S))}catch(e){}};
const k=(m,d,i)=>m+"|"+d+"|"+i,gs=(m,d,i)=>(S[k(m,d,i)]||{}).s|0;
function prog(ms,ds){let t=0,c=0;ms.forEach(m=>(ds||D).forEach(d=>R[m][2][d][1].forEach((_,i)=>{t++;if(gs(m,d,i)==2)c++})));return[c,t,t?Math.round(c/t*100):0]}
const ph=d=>d<14?'<span class="tag pre">Pre-development</span>':'<span class="tag hk">Hackathon</span>';
const bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;
let V={v:"home",m:N[0],open:8,fd:"all",fm:"all"};
function nav(){const b=[["home","Dashboard"],["time","Timeline"],["guide","Guidelines"],...N.map(n=>["m:"+n,n])];
document.getElementById("nav").innerHTML=b.map(([id,l])=>`<button class="${(V.v=="member"?"m:"+V.m:V.v)==id?"on":""}" onclick="go('${id}')">${l}</button>`).join("")}
function go(id,d){if(id.startsWith("m:")){V.v="member";V.m=id.slice(2);V.open=d||V.open}else V.v=id;draw();if(d)setTimeout(()=>{const e=document.getElementById("d"+d);if(e){e.open=true;e.scrollIntoView({behavior:"smooth",block:"start"})}},10)}
function upd(m,d,i,v){(S[k(m,d,i)]=S[k(m,d,i)]||{}).s=+v;sv();const o=[...document.querySelectorAll("details[open]")].map(e=>e.id);draw();o.forEach(i=>{const e=document.getElementById(i);if(e)e.open=true})}
function note(m,d,i,v){(S[k(m,d,i)]=S[k(m,d,i)]||{}).n=v;sv()}
function task(m,d,i,t,who){const s=gs(m,d,i),n=(S[k(m,d,i)]||{}).n||"";return`<div class="task ${s==2?"done":""}"><div class="t">${who?`<span class="chip pill" onclick="go('m:${m}',${d})">${m}</span> `:""}${t}</div><div><select class="s${s+1}" onchange="upd('${m}',${d},${i},this.value)"><option value="0" ${s==0?"selected":""}>Not started</option><option value="1" ${s==1?"selected":""}>In progress</option><option value="2" ${s==2?"selected":""}>Completed</option><option value="3" ${s==3?"selected":""}>Blocked</option></select></div><div><textarea rows="2" placeholder="Notes…" oninput="note('${m}',${d},${i},this.value)">${n}</textarea></div></div>`}
function dayCard(m,d){const[t,ts,ls]=R[m][2][d],p=prog([m],[d]);return`<details id="d${d}" ${V.open==d?"open":""}><summary>${d} November ${ph(d)}<span>${t}</span><small>${p[0]}/${p[1]} done</small></summary><div class="in">${ts.map((x,i)=>task(m,d,i,x,true)).join("")}</div></details>`}
function draw(){nav();const m=document.getElementById("m");let h="";
if(V.v=="home"){const a=prog(N),pr=prog(N,[8,9,10,11,12,13]),hk=prog(N,[14,15]);
h=`<div class="grid"><div class="card"><div class="sub">Overall team progress</div><div class="big">${a[2]}%</div>${bar(a[2])}<div class="sub">${a[0]} of ${a[1]} tasks completed</div></div>
<div class="card"><span class="tag pre">Pre-development · 8–13 Nov</span><div class="big">${pr[2]}%</div>${bar(pr[2])}<div class="sub">Research, planning, data verification, architecture, wireframes and validation.</div></div>
<div class="card"><span class="tag hk">Hackathon Development · 14–15 Nov</span><div class="big">${hk[2]}%</div>${bar(hk[2])}<div class="sub">Development, testing, presentation and submission.</div></div></div>
<h2>How to use this</h2><div class="card">1) Click your name above. 2) Open a date. 3) Tick off tasks with the status menu. 4) Click a teammate’s name under “Interlinked with” to see their related tasks.</div>
<h2>Team</h2><div class="grid">${N.map(n=>{const p=prog([n]);return`<div class="card pill" onclick="go('m:${n}')"><b>${n}</b><div class="sub">${R[n][0]}</div>${bar(p[2])}<div class="sub">${p[2]}% · ${p[0]} of ${p[1]} tasks completed</div></div>`}).join("")}</div>
<h2>Timeline</h2><div class="tl">${D.map(d=>{const p=prog(N,[d]);return`<div class="pill" style="background:var(${d<14?"--acs":"--hks"})" onclick="V.fd=${d};go('time')"><b>${d} Nov</b><br>${p[2]}%</div>`}).join("")}</div>`;
}else if(V.v=="member"){const n=V.m,p=prog([n]);h=`<div class="card"><h2 style="margin:0">${n}</h2><div class="sub">${R[n][0]}</div><p>${R[n][1]}</p>${bar(p[2])}<div class="sub">${p[2]}% complete · ${p[0]} of ${p[1]} tasks completed</div></div>${D.map(d=>dayCard(n,d)).join("")}`;
}else if(V.v=="time"){h=`<div class="row"><select onchange="V.fd=this.value;draw()"><option value="all">All dates</option>${D.map(d=>`<option value="${d}" ${V.fd==d?"selected":""}>${d} November</option>`).join("")}</select></div>${D.filter(d=>V.fd=="all"||V.fd==d).map(d=>{const ms=N.filter(n=>V.fm=="all"||V.fm==n);return `<div class="card"><b>${d} November</b> ${ph(d)}${ms.map(n=>`<h3>${n} — ${R[n][2][d][0]}</h3>${R[n][2][d][1].map((t,i)=>task(n,d,i,t,true)).join("")}`).join("")}</div>`}).join("")}`;
}else h=G.map(g=>`<div class="card"><b>${g[0]}</b><p>${g[1]}</p></div>`).join("")+`<div class="card sub">Team Three : Three — one team, one clear workflow.</div>`;
m.innerHTML=h}
draw();
</script></body></html>
