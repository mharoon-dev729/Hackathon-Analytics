function upd(m,d,i,v){(S[k(m,d,i)]=S[k(m,d,i)]||{}).s=+v;sv();const o=[...document.querySelectorAll("details[open]")].map(e=>e.id);draw();o.forEach(i=>{const e=document.getElementById(i);if(e)e.open=true})}
function note(m,d,i,v){(S[k(m,d,i)]=S[k(m,d,i)]||{}).n=v;sv()}
function task(m,d,i,t,who){const s=gs(m,d,i),n=(S[k(m,d,i)]||{}).n||"";return`<div class="task ${s==2?"done":""}"><div class="t">${who?`<span class="chip pill" onclick="go('m:${m}',${d})">${m}</span> `:""}${t}<textarea rows="1" placeholder="Add a note or blocker…" oninput="note('${m}',${d},${i},this.value)">${n}</textarea></div><select class="s${s==1?1:s==2?2:s==3?3:0}" onchange="upd('${m}',${d},${i},this.value)">${ST.map((x,j)=>`<option value="${j}" ${j==s?"selected":""}>${x}</option>`).join("")}</select></div>`}
function dayCard(m,d){const[t,ts,ls]=R[m][2][d],p=prog([m],[d]);return`<details id="d${d}" ${V.open==d?"open":""}><summary>${d} November ${ph(d)}<span>${t}</span><small>${p[0]}/${p[1]} done</small></summary><div class="in"><h3>Your tasks</h3>${ts.map((x,i)=>task(m,d,i,x)).join("")}<h3>Interlinked with</h3>${ls.map(l=>{const[n,r,w]=l.split("~"),e=r.split("-").pop(),rg=r.replace("-","–");return`<div class="lk"><a onclick="go('m:${n}',${e})">${n}</a> — ${rg} November<br><span>${w} Click the name to open ${n}’s ${e} November tasks.</span></div>`}).join("")}</div></details>`}
function draw(){nav();const m=document.getElementById("m");let h="";
if(V.v=="home"){const a=prog(N),pr=prog(N,[8,9,10,11,12,13]),hk=prog(N,[14,15]);
h=`<div class="grid"><div class="card"><div class="sub">Overall team progress</div><div class="big">${a[2]}%</div>${bar(a[2])}<div class="sub">${a[0]} of ${a[1]} tasks completed</div></div>
<div class="card"><span class="tag pre">Pre-development · 8–13 Nov</span><div class="big">${pr[2]}%</div>${bar(pr[2])}<div class="sub">Research, planning, data verification, architecture, wireframes. Confirm with organisers whether project-specific coding before the event is permitted; do not assume it is.</div></div>
<div class="card"><span class="tag hk">Hackathon Development · 14–15 Nov</span><div class="big">${hk[2]}%</div>${bar(hk[2])}<div class="sub">Development, testing, presentation and submission.</div></div></div>
<h2>How to use this</h2><div class="card">1) Click your name above. 2) Open a date. 3) Tick off tasks with the status menu. 4) Click a teammate’s name under “Interlinked with” to see their related task. Progress saves in your browser.</div>
<h2>Team</h2><div class="grid">${N.map(n=>{const p=prog([n]);return`<div class="card pill" onclick="go('m:${n}')"><b>${n}</b><div class="sub">${R[n][0]}</div>${bar(p[2])}<div class="sub">${p[2]}% · ${p[0]}/${p[1]} tasks</div></div>`}).join("")}</div>
<h2>Timeline</h2><div class="tl">${D.map(d=>{const p=prog(N,[d]);return`<div class="pill" style="background:var(${d<14?"--acs":"--hks"})" onclick="V.fd=${d};go('time')"><b>${d} Nov</b><br>${p[2]}%</div>`}).join("")}</div>`}
else if(V.v=="member"){const n=V.m,p=prog([n]);h=`<div class="card"><h2 style="margin:0">${n}</h2><div class="sub">${R[n][0]}</div><p>${R[n][1]}</p>${bar(p[2])}<div class="sub">${p[2]}% complete · ${p[0]}/${p[1]} tasks</div></div>${D.map(d=>dayCard(n,d)).join("")}`}
else if(V.v=="time"){h=`<div class="row"><select onchange="V.fd=this.value;draw()"><option value="all">All dates</option>${D.map(d=>`<option value="${d}" ${V.fd==d?"selected":""}>${d} November</option>`).join("")}</select><select onchange="V.fm=this.value;draw()"><option value="all">All members</option>${N.map(n=>`<option ${V.fm==n?"selected":""}>${n}</option>`).join("")}</select></div>`;
D.filter(d=>V.fd=="all"||V.fd==d).forEach(d=>{const ms=N.filter(n=>V.fm=="all"||V.fm==n);h+=`<div class="card"><b>${d} November</b> ${ph(d)}${ms.map(n=>`<h3>${n} — ${R[n][2][d][0]}</h3>${R[n][2][d][1].map((t,i)=>task(n,d,i,t,0)).join("")}`).join("")}</div>`})}
else h=G.map(g=>`<div class="card"><b>${g[0]}</b><p>${g[1]}</p></div>`).join("")+`<div class="card sub">Team Three : Three — one team, one clear workflow.</div>`;
m.innerHTML=h}
draw();
</script></body></html>
